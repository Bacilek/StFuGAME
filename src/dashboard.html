<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="300">
<title>Character Challenge</title>
<style>
:root{--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--line:#e1e0d9;
--Warrior:#6d8197;--Scout:#8a5a2e;--Mage:#3f55d9;--Assassin:#e0680f;--BattleMage:#9145e0;--Berserker:#d42a30;
--Druid:#5aa832;--DemonHunter:#e0559f;--Bard:#2e9fe0;--Necromancer:#0a9e80;--Paladin:#c9a800;--PlagueDoctor:#2b7a3a;--Other:#898781}
:root{--good:#006300;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--good:#0ca30c;--bad:#ef9a9a;--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--line:#2c2c2a;
--Warrior:#7f93a8;--Scout:#9a6234;--Mage:#4a5fe8;--Assassin:#f2781c;--BattleMage:#a45af2;--Berserker:#e3343a;
--Druid:#86d85a;--DemonHunter:#f46cb4;--Bard:#8fd3ff;--Necromancer:#0fbf98;--Paladin:#f6e358;--PlagueDoctor:#2b7a3a;--Other:#898781}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,sans-serif;padding:16px}
.wrap{max-width:1100px;margin:auto}
h1{font-size:22px;margin:0 0 4px} .sub{color:var(--ink2);margin-bottom:14px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--ink2);font-weight:600}
button:disabled{opacity:.4;cursor:default}
.stepper{display:flex;align-items:center;gap:6px;margin-left:auto}
.day{min-width:140px;text-align:center;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
#chart{display:block;width:100%;height:auto;overflow:visible}
.legend svg,.tip svg{display:inline-block;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;padding:0;list-style:none;color:var(--ink2);font-size:13px}
.legend li{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;white-space:nowrap}
.legend li.off{opacity:.35}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 2px 8px #0003;display:none;z-index:2;min-width:150px}
.tip .d{color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tip .r b{min-width:56px;text-align:right}
.tip .r span{color:var(--ink2)}
table{border-collapse:collapse;width:100%;margin-top:14px;font-size:13px}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink2);font-weight:600}
.main{display:flex;gap:14px;align-items:flex-start} .chartcard{flex:1;min-width:0}
.side{width:300px;flex:none;max-height:640px;overflow-y:auto} .side[hidden]{display:none}
.jump{margin-bottom:12px} .jump .who{font-weight:600} .jump .up{color:var(--good);font-weight:600;margin-left:6px}
.jump ul{margin:4px 0 0;padding-left:18px;color:var(--ink2)} .jump li{margin:2px 0}
@media (max-width:820px){.main{flex-direction:column}.side{width:100%}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 16px;cursor:pointer;overflow:hidden}
.tile:hover{border-color:var(--ink2)} .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.tile .n{font-weight:700;font-size:15px} .tile .c{color:var(--ink2);font-size:12px} .tile .s{display:flex;justify-content:space-between;margin-top:6px;font-size:13px}
.tile .s b{font-size:16px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;max-width:720px;width:calc(100% - 32px)}
dialog::backdrop{background:#0008} .close{position:absolute;top:10px;right:10px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px} .ch .bar{width:6px;height:40px;border-radius:3px;background:var(--c)}
.ch h2{margin:0;font-size:22px} .ch .c{color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0 14px}
.kv .k{color:var(--muted);font-size:12px} .kv .v{font-size:18px;font-weight:700}
.sec{margin:12px 0 4px;font-weight:700;color:var(--ink2)} .mini{width:auto} .mini td{padding:2px 18px 2px 0;border:none;text-align:left}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;width:110px;display:inline-block;vertical-align:middle;margin-left:6px}
.prog i{display:block;height:100%;background:var(--ink2)} .epic{color:#9b6be0} .legendary{color:#e08a1a}
.paperdoll{display:grid;grid-template-columns:58px 130px 58px;grid-template-rows:58px 58px 58px 58px 58px 58px;
  grid-template-areas:". hat ." "amulet portrait breast" "belt portrait gloves" "ring portrait boots" "talisman portrait ." "weapon . shield";
  gap:4px;margin:6px auto 10px;justify-content:center}
.pdportrait{grid-area:portrait;width:130px;height:130px;align-self:center;justify-self:center;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--line);overflow:hidden}
.pdportrait img{width:100%;height:100%;object-fit:cover}
.pdslot{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.pdslot.empty{opacity:.35}
.pdslot.epic{border-color:#9b6be0;box-shadow:0 0 0 1px #9b6be0 inset}
.pdslot.legendary{border-color:#e08a1a;box-shadow:0 0 0 1px #e08a1a inset}
.pdslot img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}
.pdslot .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#111;color:#fff;font-size:12px;line-height:1.4;padding:6px 9px;border-radius:6px;white-space:nowrap;z-index:5;box-shadow:0 2px 8px #0005}
.pdslot .tip b{display:block;font-size:12px}
.pdslot:hover .tip{display:block}
.tablecard{margin-top:14px;overflow-x:auto} .tablecard table{margin-top:0}
.h2{font-size:15px;margin:0 0 8px} .h2 span{color:var(--muted);font-weight:400}
.mx{width:auto} .mx td{text-align:center;min-width:52px} .mx td:first-child{text-align:left} .mx th.rot{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;height:110px;vertical-align:bottom}
.w{color:var(--good)} .l{color:var(--bad)} .self{color:var(--muted)}
.outlier{text-decoration:underline dotted;text-decoration-color:var(--muted);cursor:help}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.empty{color:var(--muted);padding:40px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<h1>Character Challenge</h1>
<div class="sub" id="sub"></div>
<div class="tiles" id="tiles"></div>
<div class="controls">
  <div class="tabs" id="tabs" role="group" aria-label="Metric"></div>
  <div class="stepper">
    <button id="prev" aria-label="One day less">&#9664;</button>
    <div class="day" id="day"></div>
    <button id="next" aria-label="One day more">&#9654;</button>
  </div>
</div>
<div class="main">
<div class="card chartcard">
  <svg id="chart" viewBox="0 0 1000 420" role="img" aria-labelledby="sub"></svg>
  <ul class="legend" id="legend"></ul>
</div>
<aside class="card side" id="side" hidden><h2 class="h2" id="sidetitle"></h2><div id="sidebody"></div></aside>
</div>
<div class="card tablecard" id="tablecard"><div id="table"></div></div>
<div class="card tablecard" id="h2hcard" hidden><h2 class="h2" id="h2htitle"></h2><div id="h2h"></div></div>
</div>
<div class="tip" id="tip"></div>
<dialog id="card"><div id="cardbody"></div><form method="dialog"><button class="close" aria-label="Close">✕</button></form></dialog>
<script>
const DATA = /*DATA*/{"generated":"","dates":[],"chars":[]}/*END*/;
const METRICS = [
  {key:"gold", label:"Gold (total gained)", fmt:v=>Math.round(v).toLocaleString()},
  {key:"xp", label:"XP (total gained)", fmt:v=>Math.round(v).toLocaleString()},
  {key:"dungeons", label:"Dungeon enemies defeated", fmt:v=>Math.round(v)},
  {key:"arena_wins_total", label:"Arena wins (total)", fmt:v=>Math.round(v)},
  {key:"rank", label:"Hall of Fame rank", fmt:v=>"#"+Math.round(v).toLocaleString(), invert:true},
  {key:"mushrooms", label:"Mushrooms (total gained)", fmt:v=>Math.round(v)},
  {key:"strength", label:"Strength", fmt:v=>Math.round(v).toLocaleString()},
  {key:"winrate", label:"Win rate [%] (simulated against all)", fmt:v=>v.toFixed(1)+" %"},
];
// Colour = class (user 2026-10-07); every character has a plain dot (no shapes, user 2026-10-07).
// A second character of the same class gets a dashed line and a hollow marker.
const CLASSES = ["Warrior","Scout","Mage","Assassin","BattleMage","Berserker","Druid","DemonHunter","Bard","Necromancer","Paladin","PlagueDoctor"];
// Each class's special combat mechanic (from sf-api's battle simulator, a port of the real game's rules) – used
// only to annotate head-to-head outliers (a win rate far from that character's own average against everyone
// else), not as a standalone glossary (user 2026-10-08: explain specific surprising match-ups, not classes).
const CLASS_QUIRKS = {
  Warrior: "25% block chance",
  Scout: "no special mechanic, a stat/weapon class",
  Mage: "lowest HP multiplier in the game (2.0× CON) – very fragile",
  Assassin: "dual-wields, gets a second attack with the off-hand weapon",
  BattleMage: "casts a fireball for bonus magic damage",
  Berserker: "frenzy – gains extra attacks the longer the fight goes on",
  DemonHunter: "~44% chance to revive once after a killing blow (less each further time) – except never against a Mage",
  Druid: "can shift into bear form, gains bonus crit chance enraged, and a chance to dodge the next hit (swoop)",
  Bard: "a melody buff/debuff that changes damage dealt over several rounds",
  Necromancer: "summons a minion/skeleton that fights alongside it",
  Paladin: "a stance system with reduced incoming damage; also immune to the Plague Doctor's poison tick",
  PlagueDoctor: "poison tincture – stacks extra damage over the next 3 rounds (skipped vs a Mage, ignores a Paladin's block)",
};
const classOf = nick => DATA.chars.find(c=>c.nick===nick)?.cls;
const SHAPES = ["square","circle","star","diamond","triangle","cross","leaf","triangleDown","pentagon","hexagon","shield","plus"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let metric = 0, upto = Math.max(1, DATA.dates.length), hidden = new Set();
// #day=N&metric=M opens a given view (handy for links and testing)
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.get("day")) upto = Math.max(1, Math.min(DATA.dates.length, +hp.get("day")));
if (hp.get("metric")) metric = Math.max(0, Math.min(METRICS.length-1, +hp.get("metric")));
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs={}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const pretty = cls => (cls||"?").replace(/([a-z])([A-Z])/g, "$1 $2");
const style = i => {
  const cls = DATA.chars[i].cls, k = CLASSES.indexOf(cls);
  const dup = DATA.chars.slice(0, i).some(c => c.cls === cls);
  return {color: css(k >= 0 ? "--" + cls : "--Other"), shape: "circle", dashed: dup || k < 0};
};
// Marker of a given shape centred on (cx, cy)
function marker(parent, shape, cx, cy, r, fill, stroke){
  const poly = (n, rot=-Math.PI/2, rr=r) => Array.from({length:n},(_,k)=>{const a=rot+k*2*Math.PI/n; return `${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`;}).join(" ");
  const a = {fill, stroke, "stroke-width":1.6};
  switch (shape){
    case "square": return el("rect",{x:cx-r*0.85,y:cy-r*0.85,width:r*1.7,height:r*1.7,...a},parent);
    case "diamond": return el("polygon",{points:poly(4,-Math.PI/2,r*1.15),...a},parent);
    case "triangle": return el("polygon",{points:poly(3,-Math.PI/2,r*1.2),...a},parent);
    case "triangleDown": return el("polygon",{points:poly(3,Math.PI/2,r*1.2),...a},parent);
    case "pentagon": return el("polygon",{points:poly(5,-Math.PI/2,r*1.1),...a},parent);
    case "hexagon": return el("polygon",{points:poly(6,0,r*1.05),...a},parent);
    case "star": { const pts=[]; for(let k=0;k<10;k++){const rr=k%2?r*0.55:r*1.3,an=-Math.PI/2+k*Math.PI/5; pts.push(`${cx+rr*Math.cos(an)},${cy+rr*Math.sin(an)}`);} return el("polygon",{points:pts.join(" "),...a},parent); }
    case "cross": { const w=r*0.45,l=r*1.15; return el("path",{d:`M${cx-l},${cy-l+w}l${w},${-w}l${l-w},${l-w}l${l-w},${-(l-w)}l${w},${w}l${-(l-w)},${l-w}l${l-w},${l-w}l${-w},${w}l${-(l-w)},${-(l-w)}l${-(l-w)},${l-w}l${-w},${-w}l${l-w},${-(l-w)}z`,...a},parent); }
    case "plus": { const w=r*0.45,l=r*1.15; return el("path",{d:`M${cx-w},${cy-l}h${2*w}v${l-w}h${l-w}v${2*w}h${-(l-w)}v${l-w}h${-2*w}v${-(l-w)}h${-(l-w)}v${-2*w}h${l-w}z`,...a},parent); }
    case "leaf": return el("path",{d:`M${cx},${cy-r*1.2}Q${cx+r*1.3},${cy} ${cx},${cy+r*1.2}Q${cx-r*1.3},${cy} ${cx},${cy-r*1.2}z`,...a},parent);
    case "shield": return el("path",{d:`M${cx-r},${cy-r}h${2*r}v${r*0.7}q0,${r*0.9} ${-r},${r*1.4}q${-r},${-r*0.5} ${-r},${-r*1.4}z`,...a},parent);
    default: return el("circle",{cx,cy,r,...a},parent);
  }
}

function niceTicks(lo, hi, n=5){
  if (lo === hi){ lo -= 1; hi += 1; }
  const step0 = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s => s >= step0);
  const a = Math.floor(lo/step)*step, b = Math.ceil(hi/step)*step, t = [];
  for (let v = a; v <= b + step/2; v += step) t.push(+v.toFixed(6));
  return t;
}

function render(){
  const m = METRICS[metric], svg = $("chart");
  history.replaceState(null, "", `#day=${upto}&metric=${metric}`);
  svg.replaceChildren();
  [...$("tabs").children].forEach((b,i)=>b.setAttribute("aria-pressed", i===metric));
  $("prev").disabled = upto <= 1; $("next").disabled = upto >= DATA.dates.length;
  $("day").textContent = DATA.dates.length ? `Day ${upto-1} of ${DATA.dates.length-1} · ${DATA.dates[upto-1]}` : "no data";
  $("sub").textContent = `${m.label} · ${DATA.chars.length} characters · updated ${DATA.generated}`;
  if (!DATA.dates.length){ const t = el("text",{x:500,y:210,"text-anchor":"middle",fill:css("--muted")},svg); t.textContent="No data yet – the first report is written at 23:50."; return; }
  const W=1000,H=420,L=70,R=110,T=16,B=36, days = DATA.dates.slice(0, upto);
  const vals = [];
  DATA.chars.forEach((c,i)=>{ if(!hidden.has(i)) days.forEach(d=>{ const v=c.rows[d]?.[m.key]; if(v!=null) vals.push(v); }); });
  let lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
  if (!m.invert) lo = Math.min(0, lo);
  const ticks = niceTicks(lo, hi); lo = ticks[0]; hi = ticks[ticks.length-1];
  const x = i => days.length === 1 ? L + (W-L-R)/2 : L + i*(W-L-R)/(days.length-1);
  const y = v => m.invert ? T + (v-lo)/(hi-lo)*(H-T-B) : H-B - (v-lo)/(hi-lo)*(H-T-B);
  // grid + y labels
  ticks.forEach(t=>{ el("line",{x1:L,x2:W-R,y1:y(t),y2:y(t),stroke:css("--grid"),"stroke-width":1},svg);
    const lab = el("text",{x:L-8,y:y(t)+4,"text-anchor":"end",fill:css("--muted"),"font-size":12},svg); lab.textContent = m.fmt(t); });
  el("line",{x1:L,x2:W-R,y1:m.invert?T:H-B,y2:m.invert?T:H-B,stroke:css("--axis"),"stroke-width":1},svg);
  // x labels (at most ~10)
  const every = Math.ceil(days.length/10);
  days.forEach((d,i)=>{ if(i%every===0||i===days.length-1){ const t=el("text",{x:x(i),y:H-B+20,"text-anchor":"middle",fill:css("--muted"),"font-size":12},svg); t.textContent=`Day ${i}`; }});
  // series
  const ends = [];
  DATA.chars.forEach((c,i)=>{
    if (hidden.has(i)) return;
    const s = style(i), pts = days.map((d,j)=>[j, c.rows[d]?.[m.key]]).filter(p=>p[1]!=null);
    if (pts.length > 1) el("polyline",{points:pts.map(p=>`${x(p[0])},${y(p[1])}`).join(" "),fill:"none",stroke:s.color,"stroke-width":2,"stroke-linejoin":"round","stroke-dasharray":s.dashed?"6 4":"none"},svg);
    pts.forEach(p=> marker(svg, s.shape, x(p[0]), y(p[1]), 5, s.dashed?css("--surface"):s.color, s.dashed?s.color:css("--surface")));
    if (pts.length){ const last = pts[pts.length-1]; ends.push({i, y:y(last[1]), name:c.nick}); }
  });
  // direct labels at the line ends only for a few series (otherwise the legend + tooltip), nudged apart
  if (ends.length > 4) ends.length = 0;
  ends.sort((a,b)=>a.y-b.y); for (let k=1;k<ends.length;k++) if (ends[k].y-ends[k-1].y<14) ends[k].y = ends[k-1].y+14;
  ends.forEach(e=>{ const t=el("text",{x:W-R+10,y:e.y+4,fill:css("--ink2"),"font-size":12},svg); t.textContent=e.name; });
  // crosshair + hover
  const cross = el("line",{y1:T,y2:H-B,stroke:css("--axis"),"stroke-width":1,visibility:"hidden"},svg);
  const hit = el("rect",{x:L-20,y:T,width:W-L-R+40,height:H-T-B,fill:"transparent"},svg);
  const tip = $("tip");
  const show = (ev) => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    let j = days.length===1 ? 0 : Math.round((px-L)/((W-L-R)/(days.length-1))); j = Math.max(0, Math.min(days.length-1, j));
    cross.setAttribute("x1", x(j)); cross.setAttribute("x2", x(j)); cross.setAttribute("visibility","visible");
    const rows = DATA.chars.map((c,i)=>({c,i,v:c.rows[days[j]]?.[m.key]})).filter(o=>!hidden.has(o.i)&&o.v!=null)
      .sort((a,b)=> m.invert ? a.v-b.v : b.v-a.v);
    tip.replaceChildren();
    const d = document.createElement("div"); d.className="d"; d.textContent=`Day ${j} · ${days[j]}`; tip.appendChild(d);
    rows.forEach(o=>{ const row=document.createElement("div"); row.className="r";
      const key=document.createElementNS(NS,"svg"); key.setAttribute("width",16); key.setAttribute("height",4);
      key.setAttribute("width",22); key.setAttribute("height",12);
      el("line",{x1:0,x2:22,y1:6,y2:6,stroke:style(o.i).color,"stroke-width":2,"stroke-dasharray":style(o.i).dashed?"4 2":"none"},key);
      marker(key, style(o.i).shape, 11, 6, 4, style(o.i).dashed?css("--surface"):style(o.i).color, style(o.i).color);
      const b=document.createElement("b"); b.textContent=m.fmt(o.v); const n=document.createElement("span"); n.textContent=o.c.nick;
      row.append(key,b,n); tip.appendChild(row); });
    tip.style.display="block";
    const tx = Math.min(ev.clientX+14, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = tx+"px"; tip.style.top = (ev.clientY+14)+"px";
  };
  hit.addEventListener("pointermove", show);
  hit.addEventListener("pointerleave", ()=>{ tip.style.display="none"; cross.setAttribute("visibility","hidden"); });
  renderTable(m, days);
  renderH2H(m, days);
  renderSide(m, days);
}

// Win rate tab: who jumped since the previous shown day and what changed (user 2026-10-07)
const JUMP = 3; // percentage points
function renderSide(m, days){
  const side = $("side");
  side.hidden = m.key !== "winrate";
  if (side.hidden) return;
  const j = days.length - 1, day = days[j], prev = days[j-1];
  const body = $("sidebody"); body.replaceChildren();
  if (!prev){ $("sidetitle").textContent = "Day 0"; body.appendChild(Object.assign(document.createElement("p"),{className:"muted",textContent:"Starting point – changes show from day 1 on."})); return; }
  $("sidetitle").textContent = `Why up? Day ${j-1} → ${j}`;
  let movers = DATA.chars.map((c,i)=>({c,i,d:(c.rows[day]?.winrate ?? NaN) - (c.rows[prev]?.winrate ?? NaN)}))
    .filter(o=>!isNaN(o.d) && !hidden.has(o.i)).sort((a,b)=>b.d-a.d);
  let big = movers.filter(o=>o.d >= JUMP);
  if (!big.length){
    body.appendChild(Object.assign(document.createElement("p"),{className:"muted",textContent:`No jump of ${JUMP}+ points. Biggest move:`}));
    big = movers.slice(0,1).filter(o=>o.d>0);
  }
  big.forEach(o=>{
    const box = document.createElement("div"); box.className = "jump";
    const head = document.createElement("div"), dot = document.createElement("span");
    dot.className="dot"; dot.style.background = style(o.i).color;
    head.append(dot, Object.assign(document.createElement("span"),{className:"who",textContent:o.c.nick}),
      Object.assign(document.createElement("span"),{className:"up",textContent:`+${o.d.toFixed(1)} pts`}));
    const ul = document.createElement("ul"), ch = o.c.rows[day]?.changes || [];
    (ch.length ? ch : ["No recorded upgrade – others got weaker relatively, or a change not tracked"]).forEach(t=>ul.appendChild(Object.assign(document.createElement("li"),{textContent:t})));
    box.append(head, ul); body.appendChild(box);
  });
}

// Who beats whom (simulated win rate of the row against the column) on the last shown day – Win rate tab only
function renderH2H(m, days){
  const card = $("h2hcard"), day = days[days.length-1], r = (DATA.h2h||{})[day];
  card.hidden = !(m.key === "winrate" && r);
  // On the Win rate tab the head-to-head replaces the plain table (user 2026-10-07)
  $("tablecard").hidden = !card.hidden;
  if (card.hidden) return;
  $("h2htitle").replaceChildren(document.createTextNode(`Head to head · Day ${days.length-1} `),
    Object.assign(document.createElement("span"), {textContent: "(row's win rate against the column)"}));
  const idx = r.players.map((n,i)=>i);
  const avg = i => { const v = r.win[i].filter(x=>x!=null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0; };
  idx.sort((a,b)=>avg(b)-avg(a));
  const t = document.createElement("table"); t.className = "mx"; const h = t.insertRow(); h.appendChild(document.createElement("th"));
  idx.forEach(j=>{ const th=document.createElement("th"); th.className="rot"; th.textContent=r.players[j]; h.appendChild(th); });
  idx.forEach(i=>{ const row=t.insertRow(), c0=row.insertCell(), d=document.createElement("span");
    d.className="dot"; d.style.background = css(CLASSES.includes(classOf(r.players[i])) ? "--"+classOf(r.players[i]) : "--Other");
    c0.append(d, document.createTextNode(r.players[i]));
    const avgI = avg(i);
    idx.forEach(j=>{ const c=row.insertCell(); if (i===j){ c.textContent="–"; c.className="self"; return; }
      const v=r.win[i][j]; c.textContent = v==null ? "?" : Math.round(v*100)+" %"; if (v==null) return;
      c.className = v>0.5 ? "w" : "l";
      const note = h2hOutlierNote(r.players[i], r.players[j], v, avgI);
      if (note){ c.className += " outlier"; c.title = note; } }); });
  $("h2h").replaceChildren(t);
}

// Flags a cell as a notable outlier when it is far from that character's own average win rate against everyone
// else (not just "low" or "high" in absolute terms – a generally weak character losing most fights is normal,
// one specific matchup swinging wildly away from their own average is what's surprising). Cites both classes'
// special mechanics as the likely (not certain – several mechanics can interact) explanation.
function h2hOutlierNote(nameA, nameB, v, avgI){
  const dev = Math.abs(v - avgI);
  if (dev < 0.3 && v > 0.08 && v < 0.92) return null;
  const a = classOf(nameA), b = classOf(nameB);
  const qa = CLASS_QUIRKS[a], qb = CLASS_QUIRKS[b];
  if (!qa && !qb) return null;
  return `${Math.round(v*100)}% vs this character's own ${Math.round(avgI*100)}% average – likely factor: `
    + `${a || "?"} (${qa || "no special mechanic"}) vs ${b || "?"} (${qb || "no special mechanic"}).`;
}

function renderTable(m, days){
  const t = document.createElement("table"), head = t.insertRow();
  ["Character", ...days.map((d,i)=>`Day ${i}`)].forEach(h=>{ const th=document.createElement("th"); th.textContent=h; head.appendChild(th); });
  // rows sorted by the last shown day (best first)
  const last = days[days.length-1], val = c => c.rows[last]?.[m.key];
  const order = [...DATA.chars].sort((a,b)=>{ const x=val(a), y=val(b); if (x==null) return 1; if (y==null) return -1; return m.invert ? x-y : y-x; });
  order.forEach(c=>{ const r=t.insertRow(); r.insertCell().textContent = `${c.nick} (${pretty(c.cls)})`;
    days.forEach(d=>{ const v=c.rows[d]?.[m.key]; r.insertCell().textContent = v==null ? "–" : m.fmt(v); }); });
  $("table").replaceChildren(t);
}

function legend(){
  const ul = $("legend"); ul.replaceChildren();
  DATA.chars.forEach((c,i)=>{ const li=document.createElement("li"), s=style(i);
    const k=document.createElementNS(NS,"svg"); k.setAttribute("width",26); k.setAttribute("height",14);
    el("line",{x1:0,x2:26,y1:7,y2:7,stroke:s.color,"stroke-width":2,"stroke-dasharray":s.dashed?"5 3":"none"},k);
    marker(k, s.shape, 13, 7, 4.5, s.dashed?css("--surface"):s.color, s.color);
    const n=document.createElement("span"); n.textContent=`${c.nick} · ${pretty(c.cls)}`;
    li.append(k,n); li.title="Click to hide / show";
    li.addEventListener("click",()=>{ hidden.has(i)?hidden.delete(i):hidden.add(i); li.classList.toggle("off"); render(); });
    ul.appendChild(li); });
}

// ---- character tiles and the card (current state, refreshed every ~10 min by the bot)
function tiles(){
  const box = $("tiles"); box.replaceChildren();
  DATA.chars.forEach((c,i)=>{
    const n = c.now || {}, b = document.createElement("button"); b.className = "tile"; b.style.setProperty("--c", style(i).color);
    const add = (cls, text) => { const d=document.createElement("div"); d.className=cls; d.textContent=text; b.appendChild(d); return d; };
    add("n", c.nick); add("c", `${pretty(c.cls)}${n.level ? " · level "+n.level : ""}`);
    const s = add("s", ""); const r = document.createElement("span"); r.textContent = n.rank ? "#"+n.rank.toLocaleString() : "–";
    const g = document.createElement("b"); g.textContent = n.strength != null ? Math.round(n.strength).toLocaleString() : "–"; g.title = "Strength";
    s.append(r, g);
    b.addEventListener("click", ()=>openCard(i));
    box.appendChild(b);
  });
}
function openCard(i){
  const c = DATA.chars[i], n = c.now, body = $("cardbody"); body.replaceChildren();
  // Everything in this card reflects the selected chart day's end-of-day snapshot (`c.rows[dayDate]`), not
  // today's live state – e.g. Day 0 must show no equipment bonus (user 2026-10-09). Only what has no daily
  // history at all (achievements, collection, XP progress, dungeon list, activity, "updated") falls back to
  // the live "now" data, and is labelled "now" below so it isn't mistaken for that day's value.
  const dayDate = DATA.dates[upto-1];
  const d = (c.rows||{})[dayDate] || null;
  const el2 = (tag, cls, text, parent=body) => { const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; parent.appendChild(e); return e; };
  const head = el2("div","ch"); head.style.setProperty("--c", style(i).color); el2("div","bar",null,head);
  const lvl = d?.level ?? n?.level;
  const t = el2("div",null,null,head); el2("h2",null,c.nick,t);
  el2("div","c",`${pretty(c.cls)}${lvl!=null?" · level "+lvl:""}${" · "+dayDate}`,t);
  if (!n && !d){ el2("p","muted","No data yet – the bot writes it every ~10 minutes while it plays this character."); $("card").showModal(); return; }
  const kv = el2("div","kv");
  const stat = (k,v) => { const e=el2("div",null,null,kv); el2("div","k",k,e); el2("div","v",v??"–",e); };
  stat("Hall of Fame", d?.rank!=null ? "#"+Math.round(d.rank).toLocaleString() : null);
  stat("Honor", d?.honor!=null ? Math.round(d.honor).toLocaleString() : null);
  stat("Strength", d?.strength!=null ? Math.round(d.strength).toLocaleString() : null);
  stat("Gold", d?.gold_now!=null ? d.gold_now.toFixed(2) : null);
  stat("Mushrooms", d?.mushrooms_now); stat("Lucky coins", d?.lucky_coins_now);
  if (n){
    const ach = n.achievements && n.achievements.total ? `${Math.round(n.achievements.owned*100/n.achievements.total)} % (${n.achievements.owned}/${n.achievements.total})` : "–";
    stat("Achievements (now)", ach); stat("Collection (now)", n.scrapbook != null ? `${n.scrapbook} items` : "–");
    stat("XP (now)", n.next_xp ? `${Math.round(n.xp*100/n.next_xp)} %` : "–");
  }
  el2("div","sec","Attributes");
  const attrsTotal = d?.attrs_total;
  if (!attrsTotal) el2("div","muted","No snapshot for this day yet.");
  else {
    const at = el2("table","mini"); const hr = at.insertRow(); ["","base","bonus","total"].forEach(h=>{ const c2=hr.insertCell(); c2.textContent=h; c2.className="k"; });
    ["STR","DEX","INT","CON","LCK"].filter(k=>attrsTotal[k]).map(k=>[k,attrsTotal[k]]).forEach(([k,v])=>{ const r=at.insertRow(); [k,v.base,"+"+v.bonus,v.total].forEach((x,j)=>{ const c2=r.insertCell(); c2.textContent=x; if(j===3) c2.style.fontWeight="700"; }); });
  }
  el2("div","sec","Potions");
  const potions = d?.potions_day;
  el2("div",null, potions && potions.length ? potions.join(", ") : "–");
  if (n){
    el2("div","sec","Dungeons (now)");
    const dt = el2("table","mini");
    if (!n.dungeons.length) el2("div","muted","–");
    n.dungeons.forEach(dg=>{ const r=dt.insertRow(); r.insertCell().textContent = dg.name.replace(/([a-z])([A-Z])/g,"$1 $2");
      const c2=r.insertCell(); c2.textContent = dg.finished ? "done" : `${dg.done}/10`; const pr=document.createElement("span"); pr.className="prog";
      const fill=document.createElement("i"); fill.style.width=Math.min(100,dg.done*10)+"%"; pr.appendChild(fill); c2.appendChild(pr); });
  }
  const equip = d?.equip || null;
  el2("div","sec", equip ? `Equipment (end of ${dayDate})` : "Equipment");
  const doll = el2("div","paperdoll");
  const port = el2("div","pdportrait",null,doll);
  const pimg = el2("img",null,null,port); pimg.src = encodeURIComponent(c.nick)+"/portrait.png";
  pimg.onerror = () => { port.replaceChildren(); };
  const SLOT_AREA = { Weapon:"weapon", Shield:"shield", Helmet:"hat", "Chest plate":"breast",
    Gloves:"gloves", Boots:"boots", Amulet:"amulet", Belt:"belt", Ring:"ring", Talisman:"talisman" };
  if (!equip) el2("div","muted","No snapshot for this day yet.");
  Object.entries(SLOT_AREA).forEach(([slot,area])=>{
    const it = (equip||{})[slot];
    const s = el2("div","pdslot"+(it ? (it.legendary?" legendary":it.epic?" epic":"") : " empty"), null, doll);
    s.style.gridArea = area;
    if (it && it.icon){ const img=el2("img",null,null,s); img.src = it.icon; img.onerror=()=>{img.style.visibility="hidden"}; }
    const tip = el2("div","tip",null,s); el2("b",null,slot,tip); el2("div",null, it ? (it.d||"–") : "empty", tip);
  });
  el2("div","sec","Guild"); el2("div",null,d?.guild_day||"–");
  $("card").showModal();
}

METRICS.forEach((m,i)=>{ const b=document.createElement("button"); b.textContent=m.label.replace(/ \(.*\)/,""); b.addEventListener("click",()=>{metric=i;render();}); $("tabs").appendChild(b); });
$("prev").addEventListener("click",()=>{ if(upto>1){upto--;render();} });

document.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft") $("prev").click(); if(e.key==="ArrowRight") $("next").click(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{legend();render();});
legend(); tiles(); render();
if (hp.get("card") != null && DATA.chars[+hp.get("card")]) openCard(+hp.get("card"));
