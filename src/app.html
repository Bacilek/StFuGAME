<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StFuGAME</title>
<style>
:root{--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#e1e0d9;--good:#2ea043;--bad:#c62828;
--Warrior:#6d8197;--Scout:#8a5a2e;--Mage:#3f55d9;--Assassin:#e0680f;--BattleMage:#9145e0;--Berserker:#d42a30;
--Druid:#5aa832;--DemonHunter:#e0559f;--Bard:#2e9fe0;--Necromancer:#0a9e80;--Paladin:#c9a800;--PlagueDoctor:#2b7a3a;--Other:#898781;--alu:#d9a400}
@media (prefers-color-scheme:dark){:root{--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--line:#2c2c2a;--good:#3fb950;--bad:#ef9a9a;--alu:#f0c419;
--Warrior:#7f93a8;--Scout:#9a6234;--Mage:#4a5fe8;--Assassin:#f2781c;--BattleMage:#a45af2;--Berserker:#e3343a;
--Druid:#86d85a;--DemonHunter:#f46cb4;--Bard:#8fd3ff;--Necromancer:#0fbf98;--Paladin:#f6e358;--PlagueDoctor:#2b7a3a;--Other:#898781}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
h1{font-size:18px;margin:0 18px 0 0}
.tabs{display:flex;gap:4px}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--ink2);font-weight:600}
button:hover{border-color:var(--ink2)}
.spacer{flex:1}
.right{display:flex;gap:8px;flex-wrap:wrap}
main{flex:1;min-height:0;overflow:auto;padding:16px}
#charts{display:none;height:100%}
#charts iframe{width:100%;height:100%;border:0;border-radius:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 14px 16px;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.tile .alu{position:absolute;left:5px;right:0;bottom:0;height:4px;background:var(--line)}
.tile .alu i{display:block;height:100%;width:0;background:var(--alu);transition:width .3s}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.tile .n{font-weight:700;font-size:15px;cursor:pointer}
.tile .c{color:var(--ink2);font-size:12px;cursor:pointer}
.tile .act{color:var(--ink2);font-size:12px;margin-top:3px;display:flex;justify-content:space-between;gap:6px}
.tile .act b{color:var(--ink);font-weight:600}
.tile .s{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;cursor:pointer}
.tile .s b{font-size:16px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.dot.running{background:var(--good)} .dot.stopped{background:var(--muted)} .dot.error{background:var(--bad)}
.status{font-size:12px;color:var(--ink2);display:flex;align-items:center;margin-top:2px}
.switch{appearance:none;width:38px;height:22px;border-radius:11px;background:var(--line);border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch:checked{background:var(--good);border-color:var(--good)}
.switch:checked::after{left:17px;background:#fff}
.empty{color:var(--muted);padding:40px;text-align:center}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px;max-width:640px;width:calc(100% - 32px)}
dialog::backdrop{background:#0008}
.close{position:absolute;top:10px;right:10px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative}
.ch .bar{width:6px;height:40px;border-radius:3px;background:var(--c)}
.ch h2{margin:0;font-size:22px} .ch .c{color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0 14px}
.kv .k{color:var(--muted);font-size:12px} .kv .v{font-size:18px;font-weight:700}
.sec{margin:12px 0 4px;font-weight:700;color:var(--ink2)}
table.mini{width:auto;border-collapse:collapse} table.mini td{padding:2px 18px 2px 0;border:none;text-align:left}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;width:110px;display:inline-block;vertical-align:middle;margin-left:6px}
.prog i{display:block;height:100%;background:var(--ink2)}
#quests{display:none}
#trainer{display:none;max-width:980px}
.trtop{display:flex;align-items:center;gap:8px;margin-bottom:10px} .trnav{margin-left:auto;display:flex;gap:6px}
.trgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px} .trcol{display:flex;flex-direction:column;gap:12px}
.trbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:0}
#trainer>.trbox{margin-top:12px}
.trinc{border-color:var(--good);border-width:2px}
.trh{font-weight:700;color:var(--ink2);margin-bottom:4px} .trmuted{color:var(--muted)}
.tritem{font-size:13px;padding:2px 0;border-bottom:1px dotted var(--line);font-family:ui-monospace,Consolas,monospace}
.tritem.epic{color:var(--alu);font-weight:600} .tritem.trfree{color:var(--muted)}
button.tract{display:block;width:100%;text-align:left;margin:4px 0}
.trtargets{display:flex;flex-direction:column;gap:3px;margin:4px 0 8px 18px}
button.trtgt{text-align:left;font:12px ui-monospace,Consolas,monospace;padding:3px 8px}
.trnote{width:100%;margin:8px 0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--page);color:var(--ink);font:inherit}
button.trsubmit{width:100%;font-weight:700} button.trsubmit:disabled{opacity:.4;cursor:default}
#fort{display:none}
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ftile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px 18px;overflow:hidden}
.ftile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.ftile .fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ftile .fh b{font-size:15px}
.ftile .fh span{color:var(--muted);font-size:11px}
.ftile h4{margin:10px 0 3px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fb{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px}
.fb div{font-size:12px;color:var(--ink2)} .fb b{display:block;font-size:15px;color:var(--ink)}
.fres{display:grid;grid-template-columns:54px 1fr auto;gap:2px 8px;align-items:center;font-size:12px}
.fres .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fres .bar i{display:block;height:100%;background:var(--ink2)}
.fres .bar i.hot{background:var(--bad)}
.fres small{color:var(--muted)}
.fline{font-size:12px;color:var(--ink2)} .fline b{color:var(--ink)}
.fline.wait{color:var(--muted)}
.qtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-bottom:16px}
.qtile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 6px 8px;text-align:center;cursor:pointer;position:relative}
.qtile[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.qtile .qimg{width:72px;height:72px;margin:0 auto 6px;border-radius:50%;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px}
.qtile .qimg img{width:100%;height:100%;object-fit:cover;display:block}
.qtile .qn{font-weight:700;font-size:13px;word-break:break-word}
.qpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.qpanel h3{margin:0 0 2px;font-size:16px}
.qpanel .sub{color:var(--ink2);font-size:12px;margin-bottom:10px}
.qbar{position:relative;height:16px;background:var(--line);border-radius:8px;margin:26px 8px 34px}
.qbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--good)}
.qbar .mk{position:absolute;top:-22px;transform:translateX(-50%);font-size:11px;color:var(--ink2);text-align:center;white-space:nowrap}
.qbar .mk b{display:block;font-size:15px;line-height:1}
.qbar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.qbar .rw{position:absolute;top:20px;transform:translateX(-50%);font-size:11px;color:var(--ink2);text-align:center;max-width:120px;line-height:1.2}
.qbar .rw.open{color:var(--muted);text-decoration:line-through}
.qlist{display:flex;flex-direction:column;gap:8px}
.qtask{display:grid;grid-template-columns:minmax(150px,1fr) 100px;gap:10px;align-items:center;font-size:13px}
.qtask .nm small{display:block;color:var(--muted);font-size:11px}
.qtask .pb{height:12px;background:var(--line);border-radius:6px;overflow:hidden;position:relative}
.qtask .pb i{display:block;height:100%;background:var(--Mage)}
.qtask .pt{text-align:right;color:var(--ink2)}
.qtask.skip .nm{color:var(--muted)}
.qdone{color:var(--good);font-size:13px}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:6px}
.bslot{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink2);text-align:center;padding:2px;overflow:visible}
.bslot.empty{opacity:.3}
.bslot img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.bslot img.gemmark,.pdslot img.gemmark{position:absolute;right:2px;bottom:2px;width:12px;height:12px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 0 1px #000)}
.gemmark.gemempty{position:absolute;right:2px;bottom:2px;width:10px;height:10px;box-sizing:border-box;border:1.5px solid var(--ink2);border-radius:50%;background:rgba(0,0,0,.25);pointer-events:none}
.bslot.epic{border-color:#9b6be0;box-shadow:0 0 0 1px #9b6be0 inset}
.bslot.legendary{border-color:#e08a1a;box-shadow:0 0 0 1px #e08a1a inset}
.bslot .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--page);border-radius:6px;padding:5px 8px;font-size:11px;line-height:1.3;white-space:nowrap;z-index:5;text-align:left}
.bslot .tip b{display:block;font-size:12px}
.bslot:hover .tip{display:block}
.epic{color:#9b6be0} .legendary{color:#e08a1a}
.gp{width:334px;margin:8px auto 12px}
.paperdoll{display:grid;grid-template-columns:repeat(4,76px);grid-template-rows:repeat(4,76px);gap:6px;
  grid-template-areas:"hat portrait portrait amulet" "breast portrait portrait belt" "gloves portrait portrait ring" "boots weapon shield talisman"}
.pdportrait{grid-area:portrait;display:flex;flex-direction:column;gap:6px;min-height:0}
.pdimg{flex:1;min-height:0;position:relative;border-radius:8px;background:var(--line);overflow:hidden}
.pdimg img{width:100%;height:100%;object-fit:cover;display:block}
.pdname{position:absolute;left:0;right:0;bottom:0;padding:14px 4px 4px;text-align:center;font-weight:700;font-size:13px;line-height:1.2;color:#fff;background:linear-gradient(transparent,#000c);text-shadow:0 1px 2px #000}
.pdname small{display:block;font-weight:600;color:#e8c766;font-size:11px}
.pdlevel{flex:none;height:24px;border-radius:6px;background:var(--line);color:var(--ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.pdslot{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.pdslot.empty{opacity:.35}
.pdslot.nohand{opacity:1;background:transparent}
.pdslot.nohand::before{content:"";position:absolute;inset:6px;pointer-events:none;background:
  linear-gradient(to top right,transparent calc(50% - 2px),#d6342c calc(50% - 2px),#d6342c calc(50% + 2px),transparent calc(50% + 2px)),
  linear-gradient(to bottom right,transparent calc(50% - 2px),#d6342c calc(50% - 2px),#d6342c calc(50% + 2px),transparent calc(50% + 2px))}
.pdslot.epic{border-color:#9b6be0;box-shadow:0 0 0 1px #9b6be0 inset}
.pdslot.legendary{border-color:#e08a1a;box-shadow:0 0 0 1px #e08a1a inset}
.pdslot img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}
.pdslot .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#111;color:#fff;font-size:12px;line-height:1.4;padding:6px 9px;border-radius:6px;white-space:nowrap;z-index:5;box-shadow:0 2px 8px #0005}
.pdslot .tip b{display:block;font-size:12px}
.pdslot:hover .tip{display:block}
.pdattrs{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:auto;gap:6px;margin-top:8px}
.pdattr{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--surface)}
.pdattr .k{font-weight:700;font-size:12px;letter-spacing:.02em;display:flex;justify-content:space-between;gap:8px}
.pdattr .k b{font-size:16px}
.pdattr .s{color:var(--muted);font-size:11px;min-height:14px}
.pdpotions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;justify-content:center}
.pdpot{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink2);text-align:center}
.pdpot img{width:48px;height:48px;object-fit:contain}
</style>
</head>
<body>
<header>
  <h1>StFuGAME</h1>
  <div class="tabs">
    <button id="tabChars" aria-pressed="true">Characters</button>
    <button id="tabCharts" aria-pressed="false">Charts</button>
    <button id="tabQuests" aria-pressed="false">Quests</button>
    <button id="tabFort" aria-pressed="false">Fortress</button>
    <button id="tabTrainer" aria-pressed="false">Inventory trainer</button>
  </div>
  <div class="spacer"></div>
  <div class="right">
    <button id="startAll">Start all</button>
    <button id="stopAll">Stop all</button>
    <button id="eod">Run end of day now</button>
    <button id="attackMe" aria-pressed="false" title="While on, every bot character looks up Bacilek31 in the Hall of Fame and attacks him (his honor and rank sink)">Attack me: off</button>
    <span id="eodStatus" style="display:none;color:var(--ink2);font-size:12px;align-self:center"></span>
    <button id="browser">Open in browser</button>
  </div>
</header>
<main>
  <div id="tiles" class="tiles"><p class="empty">Waiting for status…</p></div>
  <div id="charts"><iframe src="dashboard.html" title="Charts"></iframe></div>
  <div id="fort"><div id="ftiles" class="ftiles"><p class="empty">Waiting for status...</p></div></div>
  <div id="trainer"></div>
  <div id="quests"><div id="qtiles" class="qtiles"><p class="empty">Waiting for statusâ¦</p></div><div id="qdetail"></div></div>
</main>
<dialog id="card"><div id="cardbody"></div><form method="dialog"><button class="close" aria-label="Close">✕</button></form></dialog>
<script>
const $ = id => document.getElementById(id);
const post = cmd => {
  try { window.ipc.postMessage(JSON.stringify(cmd)); }
  catch (e) { showIpcError(`Could not send ${cmd.cmd}: ${e.message}`); }
};
function showIpcError(msg){
  let bar = document.getElementById("ipcerr");
  if (!bar){ bar = document.createElement("div"); bar.id = "ipcerr";
    bar.style.cssText = "background:#c62828;color:#fff;padding:6px 16px;font-size:12px"; document.body.insertBefore(bar, document.body.firstChild); }
  bar.textContent = msg;
}
window.addEventListener("error", e => showIpcError(`Page error: ${e.message}`));
setTimeout(()=>{ if (typeof window.ipc === "undefined") showIpcError("window.ipc is not available – the app window cannot talk to the bot. Restart StFuGAME."); }, 1500);
const CLASSES = ["Warrior","Scout","Mage","Assassin","BattleMage","Berserker","Druid","DemonHunter","Bard","Necromancer","Paladin","PlagueDoctor"];
const pretty = cls => (cls||"?").replace(/([a-z])([A-Z])/g, "$1 $2");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const classColor = cls => css("--" + (CLASSES.includes(cls) ? cls : "Other"));

let STATUS = [];

$("tabChars").addEventListener("click", () => setTab("chars"));
$("tabCharts").addEventListener("click", () => setTab("charts"));
$("tabQuests").addEventListener("click", () => setTab("quests"));
$("tabFort").addEventListener("click", () => setTab("fort"));
$("tabTrainer").addEventListener("click", () => setTab("trainer"));
let currentTab = "chars";
function setTab(tab){
  currentTab = tab;
  $("tabChars").setAttribute("aria-pressed", tab === "chars");
  $("tabCharts").setAttribute("aria-pressed", tab === "charts");
  $("tabQuests").setAttribute("aria-pressed", tab === "quests");
  $("tabFort").setAttribute("aria-pressed", tab === "fort");
  $("tabTrainer").setAttribute("aria-pressed", tab === "trainer");
  $("tiles").style.display = tab === "chars" ? "grid" : "none";
  $("charts").style.display = tab === "charts" ? "block" : "none";
  $("quests").style.display = tab === "quests" ? "block" : "none";
  $("fort").style.display = tab === "fort" ? "block" : "none";
  $("trainer").style.display = tab === "trainer" ? "block" : "none";
  if (tab === "trainer") TR.open();
  if (tab === "fort") renderFort();
  if (tab === "quests") renderQuests();
}
function setAll(on){
  const until = Date.now() + PENDING_MS;
  for (const [nick, el] of tileEls){ pendingSwitch.set(nick, {until, checked: on}); el.sw.checked = on; }
  post({cmd: on ? "start_all" : "stop_all"});
}
$("startAll").addEventListener("click", () => setAll(true));
$("stopAll").addEventListener("click", () => setAll(false));
$("eod").addEventListener("click", () => {
  post({cmd:"eod"});
  eodClickedAt = Date.now();
  renderEodStatus(STATUS.filter(c=>c.state==="running").map(c=>c.name));
});
let eodClickedAt = 0;
// Shows progress while characters are still processing the last "Run end of day now" click (reports + the Day 0
// round), so clicking it doesn't look like it did nothing for the next minute or two (user 2026-10-08).
let eodWasPending = false;
function renderEodStatus(pending){
  const el = $("eod"), st = $("eodStatus");
  if (pending.length > 0){
    eodWasPending = true;
    el.disabled = true;
    st.style.display = "inline";
    st.textContent = "Updating… waiting for " + pending.join(", ");
  } else {
    el.disabled = false;
    if (eodWasPending){
      eodWasPending = false;
      // every report is written now: reload the charts (they only refresh by themselves every 5 min)
      const f = document.querySelector("#charts iframe"); if (f) f.src = f.src;
    }
    // Keep a brief "Done" visible, but only right after an actual click, not forever/on every status tick
    if (eodClickedAt && Date.now() - eodClickedAt < 15000){ st.style.display = "inline"; st.textContent = "Done – all characters updated, charts reloaded"; }
    else st.style.display = "none";
  }
}
let attackMeOn = false;
$("attackMe").addEventListener("click", () => post({cmd:"attack_me", on: !attackMeOn}));
function renderAttackMe(on){
  attackMeOn = !!on;
  const b = $("attackMe");
  b.setAttribute("aria-pressed", attackMeOn ? "true" : "false");
  b.textContent = attackMeOn ? "Attack me: ON" : "Attack me: off";
}
$("browser").addEventListener("click", () => post({cmd:"open_browser"}));

// Tile DOM elements persist across ticks (keyed by character name) so an in-flight click on the switch is never
// torn out from under the user; only a "change" event (real user interaction) sends a command, and for a few
// seconds after that the switch shows the user's intent rather than whatever the backend reports meanwhile
// (login takes a moment) – otherwise it looked like "the slider does nothing and resets itself" (user 2026-10-08).
const tileEls = new Map();
const pendingSwitch = new Map();
const PENDING_MS = 5000;

function renderTiles(){
  const box = $("tiles");
  if (!STATUS.length){ box.replaceChildren(); tileEls.clear(); const p=document.createElement("p"); p.className="empty"; p.textContent="No character configured (SF_USER/SF_ACCOUNTS in .env)."; box.appendChild(p); return; }
  for (const nick of [...tileEls.keys()]) if (!STATUS.some(c=>c.name===nick)){ tileEls.get(nick).tile.remove(); tileEls.delete(nick); pendingSwitch.delete(nick); }
  if (box.querySelector(".empty")) box.replaceChildren();
  STATUS.forEach(c=>{
    let el = tileEls.get(c.name);
    if (!el){
      const tile = document.createElement("div"); tile.className = "tile";
      const top = document.createElement("div"); top.className = "top";
      const name = document.createElement("div"); name.className = "n"; name.textContent = c.name;
      name.addEventListener("click", ()=>openCard(STATUS.find(s=>s.name===c.name)));
      const sw = document.createElement("input"); sw.type = "checkbox"; sw.className = "switch";
      sw.title = "Start / stop this character";
      sw.addEventListener("change", ()=>{ pendingSwitch.set(c.name, {until: Date.now()+PENDING_MS, checked: sw.checked});
        post({cmd: sw.checked ? "start" : "stop", name: c.name}); });
      top.append(name, sw); tile.appendChild(top);
      const cl = document.createElement("div"); cl.className = "c";
      cl.addEventListener("click", ()=>openCard(STATUS.find(s=>s.name===c.name))); tile.appendChild(cl);
      const act = document.createElement("div"); act.className = "act";

      const dot = document.createElement("span"); dot.className = "dot"; const dotText = document.createTextNode("");
      st.append(dot, dotText); tile.appendChild(st);
      const s = document.createElement("div"); s.className = "s";
      s.addEventListener("click", ()=>openCard(STATUS.find(x=>x.name===c.name)));
      const r = document.createElement("span"); const g = document.createElement("b"); g.title = "Power";
      s.append(r, g); tile.appendChild(s);
      const alu = document.createElement("div"); alu.className = "alu"; const aluFill = document.createElement("i"); alu.appendChild(aluFill);
      tile.appendChild(alu);
      box.appendChild(tile);
      el = {tile, name, cl, actLabel, actTimer, dot, dotText, r, g, sw, aluFill, until: null};
      tileEls.set(c.name, el);
    }
    const n = c.now || {};
    el.tile.style.setProperty("--c", classColor(n.class));
    el.cl.textContent = n.class ? `${pretty(n.class)} · level ${n.level}` + (n.updated ? ` · ${n.updated}` : "") : "not logged in yet";
    el.dot.className = "dot " + c.state; el.dotText.textContent = " " + c.state;
    el.r.textContent = n.rank ? "#"+n.rank.toLocaleString() : "–";
    el.g.textContent = n.power != null ? Math.round(n.power).toLocaleString() : "–";
    el.actLabel.textContent = n.activity ? n.activity.label : "–";
    el.until = n.activity && n.activity.until ? new Date(n.activity.until).getTime() : null;
    updateTimer(el);
    const pend = pendingSwitch.get(c.name);
    if (pend && Date.now() < pend.until) el.sw.checked = pend.checked;
    else { pendingSwitch.delete(c.name); el.sw.checked = c.state === "running"; }
    const pct = n.thirst_max_sec ? Math.max(0, Math.min(100, n.thirst_sec*100/n.thirst_max_sec)) : 0;
    el.aluFill.style.width = pct + "%";
    el.aluFill.parentElement.title = n.thirst_sec != null ? `Thirst for Adventure: ${Math.round(n.thirst_sec/60)} / ${Math.round(n.thirst_max_sec/60)} min` : "";
  });
  // Best Hall of Fame rank first (user 2026-10-09); touch the DOM only when the order really changed
  const rank = c => (c.now || {}).rank || Infinity;
  const want = [...STATUS].sort((a,b)=>rank(a)-rank(b)).map(c=>tileEls.get(c.name).tile);
  if (want.some((t,i)=>box.children[i] !== t)) want.forEach(t=>box.appendChild(t));
}

// A countdown ("Xh Ym" / "Ym Zs") for the character's current activity, ticking every second between status
// refreshes so it counts down smoothly instead of jumping every ~2 s.
function updateTimer(el){
  if (el.until == null){ el.actTimer.textContent = ""; return; }
  const left = Math.max(0, Math.round((el.until - Date.now())/1000));
  const h = Math.floor(left/3600), m = Math.floor((left%3600)/60), s = left%60;
  el.actTimer.textContent = h > 0 ? `${h}h ${m}m` : m > 0 ? `${m}m ${s}s` : `${s}s`;
}
setInterval(()=>{ for (const el of tileEls.values()) updateTimer(el); }, 1000);

// Called by the Rust side every ~2 s with the latest status (tray.rs / app.rs → evaluate_script) and how many
// characters still have to finish the latest "Run end of day now" request (0 = none in flight / already done).
// ---- Quests tab (user 2026-10-12): character tiles (portrait + name only); a click shows that character's open Gleeman
// quests, chests and event quests with progress bars like the game client.
let qSelected = null;
const humanTask = n => n.replace(/([a-z])([A-Z])/g, "$1 $2").replace(/\(/g, " (");
const PAID_TASKS = /^(DrinkBeer)/;
function untilText(iso){
  const ms = new Date(iso) - Date.now(); if (!(ms > 0)) return "ended";
  const h = Math.floor(ms/3600000), d = Math.floor(h/24);
  return d > 0 ? `${d} d ${h%24} h` : `${h} h ${Math.floor((ms%3600000)/60000)} min`;
}
function qSection(title, q, isEvent){
  const box = document.createElement("div"); box.className = "qpanel";
  const h = document.createElement("h3"); h.textContent = title; box.appendChild(h);
  const sub = document.createElement("div"); sub.className = "sub";
  const chests = q.chests || [];
  const next = chests.find(c => !c.opened && q.points < c.need);
  const claimable = chests.filter(c => !c.opened && q.points >= c.need).length;
  let txt = `${q.points} points earned (${q.max} possible)`;
  if (next) txt += ` · next chest in ${next.need - q.points} point${next.need - q.points === 1 ? "" : "s"}`;
  else if (claimable) txt += ` · ${claimable} chest${claimable === 1 ? "" : "s"} ready to open`;
  else if (chests.length) txt += " · all chests opened";
  if (isEvent && q.end) txt += ` · event ends in ${untilText(q.end)}`;
  sub.textContent = txt; box.appendChild(sub);
  // points bar with the chest thresholds
  const top = Math.max(...chests.map(c => c.need), 1);
  const bar = document.createElement("div"); bar.className = "qbar";
  const fill = document.createElement("div"); fill.className = "fill"; fill.style.width = Math.min(100, q.points * 100 / top) + "%"; bar.appendChild(fill);
  chests.forEach(c => {
    const x = Math.min(100, c.need * 100 / top);
    const tick = document.createElement("div"); tick.className = "tick"; tick.style.left = `calc(${x}% - 1px)`; bar.appendChild(tick);
    const mk = document.createElement("div"); mk.className = "mk"; mk.style.left = x + "%";
    mk.innerHTML = `<b>${c.opened ? "✔" : (q.points >= c.need ? "🎁" : "🔒")}</b>${c.need}`;
    bar.appendChild(mk);
    const rw = document.createElement("div"); rw.className = "rw" + (c.opened ? " open" : ""); rw.style.left = x + "%";
    rw.textContent = (c.rewards || []).join(", "); bar.appendChild(rw);
  });
  box.appendChild(bar);
  // only the unfinished tasks
  const open = (q.tasks || []).filter(t => !t.done);
  if (!open.length){ const d = document.createElement("div"); d.className = "qdone"; d.textContent = "All tasks done ✔"; box.appendChild(d); return box; }
  const list = document.createElement("div"); list.className = "qlist";
  open.forEach(t => {
    const row = document.createElement("div"); row.className = "qtask" + (PAID_TASKS.test(t.name) ? " skip" : "");
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = humanTask(t.name);
    if (PAID_TASKS.test(t.name)){ const s = document.createElement("small"); s.textContent = "costs mushrooms – the bot skips it"; nm.appendChild(s); }
    const prog = document.createElement("div"); prog.className = "pt"; prog.textContent = `${t.current}/${t.target} · +${t.points}`;
    row.append(nm, prog); list.appendChild(row);
  });
  box.appendChild(list);
  return box;
}
const questsDone = c => { const q = c.quests; if (!q || !q.daily) return false;
  const all = p => !p || (p.chests || []).every(x => x.opened);
  return all(q.daily) && all(q.event); };
function renderQuests(){
  const tiles = $("qtiles");
  if (!STATUS.length){ tiles.replaceChildren(); const p = document.createElement("p"); p.className = "empty"; p.textContent = "No character configured."; tiles.appendChild(p); $("qdetail").replaceChildren(); return; }
  const shown = STATUS.filter(c => !questsDone(c));
  if (!shown.length){ tiles.replaceChildren(); const p = document.createElement("p"); p.className = "empty"; p.textContent = "Every character has collected all chests (daily and event) â nothing to do."; tiles.appendChild(p); $("qdetail").replaceChildren(); return; }
  if (!qSelected || !shown.some(c => c.name === qSelected)) qSelected = shown[0].name;
  tiles.replaceChildren();
  shown.forEach(c => {
    const t = document.createElement("div"); t.className = "qtile"; t.setAttribute("aria-pressed", c.name === qSelected);
    t.style.setProperty("--c", classColor(c.now && c.now.class));
    const img = document.createElement("div"); img.className = "qimg";
    const im = document.createElement("img"); im.src = encodeURIComponent(c.name) + "/portrait.png";
    im.onerror = () => { im.remove(); img.textContent = c.name.slice(0, 1).toUpperCase(); }; img.appendChild(im);
    const n = document.createElement("div"); n.className = "qn"; n.textContent = c.name;
    t.append(img, n); t.addEventListener("click", () => { qSelected = c.name; renderQuests(); });
    tiles.appendChild(t);
  });
  const c = STATUS.find(s => s.name === qSelected), q = c && c.quests;
  const det = $("qdetail"); det.replaceChildren();
  if (!q || !q.daily){ const p = document.createElement("p"); p.className = "empty"; p.textContent = `${qSelected}: no quest data yet (the character has to be running).`; det.appendChild(p); return; }
  const upd = document.createElement("div"); upd.className = "sub"; upd.style.margin = "0 0 8px";
  upd.textContent = q.updated ? `${qSelected} · updated ${new Date(q.updated).toLocaleTimeString()}` : qSelected; det.appendChild(upd);
  // A section whose chests are all opened has nothing more to give: it is not shown (user 2026-10-12)
  const allOpen = p => !p || (p.chests || []).every(x => x.opened);
  if (!allOpen(q.daily)) det.appendChild(qSection("Daily quests (Goblin Gleeman)", q.daily, false));
  if (q.event && !allOpen(q.event)) det.appendChild(qSection("Event quests", q.event, true));
}
// ---- Inventory trainer tab (user 2026-10-17): generated inventory scenarios; the user picks the right move, the answers go to
// roster/trainer.jsonl (one line per answer, with the full scenario) so the rules can be derived from them. Scenario n is
// always the same (seeded), so answers can be replayed against the bot's logic.
const TR = (() => {
  const SLOTS = ["Weapon","Helmet","Armor","Gloves","Boots","Belt","Ring","Amulet","Talisman"];
  const MAIN = {Warrior:"STR",Scout:"DEX",Mage:"INT",Assassin:"DEX",BattleMage:"STR",Berserker:"STR",Druid:"DEX",DemonHunter:"DEX",Bard:"INT",Necromancer:"INT",Paladin:"STR",PlagueDoctor:"DEX"};
  const ATTRS = ["STR","DEX","INT"];
  const BAG = 15;
  const LS = "trainerAnswers";
  let answers = {}; try { answers = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) {}
  const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(answers)); } catch (e) {} };
  let n = 1, sc = null, picked = null, history = [];

  const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  const pick = (r, xs) => xs[Math.floor(r() * xs.length)];
  const wpick = (r, pairs) => { let t = pairs.reduce((s, p) => s + p[1], 0), x = r() * t; for (const [v, w] of pairs) { if ((x -= w) < 0) return v; } return pairs[0][0]; };
  const between = (r, a, b) => a + r() * (b - a);

  function genItem(r, c, slot, q, epic) {
    const unit = c.attrs[c.main] / 9 * q;
    const a = {};
    if (epic) {
      const v = Math.round(unit * 0.55);
      const set = wpick(r, [[[c.main, "CON", "LCK"], 3], [["STR", "DEX", "INT", "CON", "LCK"], 2], [[c.main, "CON"], 1]]);
      for (const k of set) a[k] = v;
    } else {
      const k = wpick(r, [[c.main, 6], ["CON", 2], ["LCK", 1.2], [pick(r, ATTRS.filter(x => x !== c.main)), 1.3]]);
      a[k] = Math.round(unit * between(r, 0.6, 1.1));
      if (r() < 0.35) { const k2 = pick(r, [c.main, "CON", "LCK"]); if (k2 !== k) a[k2] = Math.round(unit * between(r, 0.25, 0.6)); }
    }
    const hasSlot = r() < 0.7;
    const gem = !hasSlot ? null : (r() < 0.5 ? { empty: true } : genGem(r, c));
    return { slot, epic: !!epic, a, gem };
  }
  function genGem(r, c) {
    const t = wpick(r, [[c.main, 4], ["CON", 3], ["LCK", 2.5], [pick(r, ATTRS.filter(x => x !== c.main)), 3.5], ["ALL", 0.4]]);
    return { t, v: Math.round(c.level * between(r, 0.45, 1.0)) };
  }
  function genPotion(r, c) {
    const t = wpick(r, [[c.main, 4], ["CON", 3.5], ["LCK", 3], [pick(r, ATTRS.filter(x => x !== c.main)), 3], ["LIFE", 0.9]]);
    const big = c.level >= 35;
    const size = t === "LIFE" ? 25 : wpick(r, big ? [[10, 3], [15, 3], [25, 2.5]] : [[10, 4], [15, 3]]);
    return { t, size };
  }
  function generate(i) {
    const r = rng(i * 7919 + 13);
    const cls = pick(r, Object.keys(MAIN));
    const level = Math.round(wpick(r, [[between(r, 25, 60), 2], [between(r, 60, 140), 3], [between(r, 140, 300), 3]]));
    const main = MAIN[cls];
    const m = Math.round(level * between(r, 3.5, 6));
    const c = { cls, level, main, attrs: { [main]: m, CON: Math.round(m * between(r, 0.4, 1.05)), LCK: Math.round(m * between(r, 0.12, 0.4)) } };
    const quality = between(r, 0.7, 1.3);
    c.equip = SLOTS.map(s => genItem(r, c, s, quality * between(r, 0.8, 1.2), r() < 0.12));
    // active potions with the days left (a big potion with 1 day left is worth little, with 10 days a lot)
    const nAct = wpick(r, [[0, 1], [1, 1.5], [2, 3], [3, 4.5]]);
    const kinds = []; c.active = [];
    for (let k = 0; k < nAct; k++) { const p = genPotion(r, c); if (kinds.includes(p.t)) continue; kinds.push(p.t); p.days = p.t === "LIFE" ? Math.ceil(between(r, 1, 7)) : Math.ceil(between(r, 1, 11)); c.active.push(p); }
    // backpack
    const free = wpick(r, [[0, 1], [1, 3], [2, 2.5], [3, 2], [5, 1.5], [8, 1]]);
    c.bag = [];
    const fillable = BAG - free;
    const mix = [["epic", 1.4], ["gem", 3], ["potion", 2.4], ["item", 1.6], ["kept", 0.8]];
    for (let k = 0; k < fillable; k++) {
      const kind = wpick(r, mix);
      if (kind === "epic") c.bag.push({ kind, it: genItem(r, c, pick(r, SLOTS), quality * between(r, 0.8, 1.2), true) });
      else if (kind === "gem") c.bag.push({ kind, gem: genGem(r, c) });
      else if (kind === "potion") c.bag.push({ kind, p: genPotion(r, c) });
      else if (kind === "item") c.bag.push({ kind, it: genItem(r, c, pick(r, SLOTS), quality * between(r, 0.4, 0.9), false) });
      else c.bag.push({ kind: "kept", it: genItem(r, c, pick(r, SLOTS), quality * between(r, 0.9, 1.3), false) });
    }
    const inKind = wpick(r, [["gem", 3], ["mine", 1.5], ["potion", 3], ["item", 2.6], ["epic", 2.4]]);
    if (inKind === "gem" || inKind === "mine") c.incoming = { kind: "gem", mine: inKind === "mine", gem: genGem(r, c) };
    else if (inKind === "potion") c.incoming = { kind: "potion", p: genPotion(r, c) };
    else if (inKind === "epic") c.incoming = { kind: "item", it: genItem(r, c, pick(r, SLOTS), quality * between(r, 0.8, 1.4), true) };
    else c.incoming = { kind: "item", it: genItem(r, c, pick(r, SLOTS), quality * between(r, 0.7, 1.4), false) };
    c.free = BAG - c.bag.length;
    return c;
  }

  const gemTxt = g => g.empty ? "◇ empty slot" : "◆ " + g.t + "+" + g.v;
  const statTxt = it => Object.entries(it.a).map(([k, v]) => k + "+" + v).join(" ");
  const itemTxt = it => it.slot + (it.epic ? " ★EPIC" : "") + "  " + statTxt(it) + "  " + (it.gem ? gemTxt(it.gem) : "(no gem slot)");
  const potTxt = p => p.t === "LIFE" ? "Eternal Life" : p.t + " " + p.size + " %";
  const bagTxt = b => b.kind === "gem" ? "Gem " + gemTxt(b.gem) : b.kind === "potion" ? "Potion " + potTxt(b.p) : (b.kind === "epic" ? "★ " : b.kind === "kept" ? "(waiting for a gem) " : "") + itemTxt(b.it);

  const h = (tag, cls, text, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (parent) parent.appendChild(e); return e; };

  function actionsFor(c) {
    const inc = c.incoming, A = [];
    const slotTargets = () => c.equip.map((e, i) => ({ id: i, label: itemTxt(e) }));
    const bagTargets = () => c.bag.map((b, i) => ({ id: i, label: bagTxt(b) }));
    if (inc.kind === "item") {
      A.push({ id: "equip_sell", label: "Equip it, sell the old " + inc.it.slot });
      A.push({ id: "equip_keep", label: "Equip it, keep the old one in the backpack" });
      A.push({ id: "keep", label: "Keep it in the backpack (waiting for a gem / later)" });
      A.push({ id: "sell", label: "Sell it" });
      A.push({ id: "keep_sell", label: "Keep it, sell this from the backpack to make room:", target: bagTargets });
      A.push({ id: "equip_keep_sell", label: "Equip it, keep the old one, sell this to make room:", target: bagTargets });
    } else if (inc.kind === "gem") {
      A.push({ id: "socket", label: "Socket it into:", target: slotTargets });
      A.push({ id: "replace", label: "Replace the gem of (the old one is lost):", target: slotTargets });
      A.push({ id: "keep", label: "Keep it in the backpack" });
      A.push({ id: "sell", label: "Sell it" });
      A.push({ id: "keep_sell", label: "Keep it, sell this from the backpack to make room:", target: bagTargets });
      if (inc.mine) A.push({ id: "leave", label: "Leave it in the mine (do not collect yet)" });
    } else {
      A.push({ id: "drink", label: "Drink it (free slot / extends / replaces the active one of its kind)" });
      A.push({ id: "swap", label: "Remove this active potion and drink it:", target: () => c.active.map((p, i) => ({ id: i, label: potTxt(p) + ", " + p.days + " d left" })) });
      A.push({ id: "keep", label: "Keep it in the backpack" });
      A.push({ id: "sell", label: "Sell it" });
      A.push({ id: "keep_sell", label: "Keep it, sell this from the backpack to make room:", target: bagTargets });
    }
    A.push({ id: "unsure", label: "I don't know / depends (explain in the note)" });
    return A;
  }

  function render() {
    const root = $("trainer"); root.textContent = "";
    sc = generate(n);
    const c = sc; picked = null;
    const done = Object.keys(answers).length;
    const top = h("div", "trtop", null, root);
    h("b", null, "Scenario #" + n, top);
    h("span", "trmuted", "  answered: " + done, top);
    const nav = h("span", "trnav", null, top);
    const prev = h("button", null, "◀ Back", nav); prev.onclick = () => { if (history.length) { n = history.pop(); render(); } };
    const skip = h("button", null, "Skip ▶", nav); skip.onclick = () => { history.push(n); n++; render(); };

    const g = h("div", "trgrid", null, root);
    const L = h("div", "trcol", null, g), R = h("div", "trcol", null, g);

    const ch = h("div", "trbox", null, L);
    h("div", "trh", pretty(c.cls) + ", level " + c.level + " (main " + c.main + ")", ch);
    const ratio = Math.round(c.attrs.CON / c.attrs[c.main] * 100);
    h("div", null, c.main + " " + c.attrs[c.main] + "   CON " + c.attrs.CON + " (" + ratio + " % of main, ideal 80)   LCK " + c.attrs.LCK, ch);

    const eq = h("div", "trbox", null, L);
    h("div", "trh", "Worn", eq);
    c.equip.forEach(e => h("div", "tritem" + (e.epic ? " epic" : ""), itemTxt(e), eq));

    const po = h("div", "trbox", null, L);
    h("div", "trh", "Active potions", po);
    if (!c.active.length) h("div", "trmuted", "none", po);
    c.active.forEach(p => h("div", "tritem", potTxt(p) + " – " + p.days + (p.days === 1 ? " day" : " days") + " left", po));

    const bg = h("div", "trbox", null, R);
    h("div", "trh", "Backpack " + c.bag.length + "/" + BAG + " (" + c.free + " free)", bg);
    c.bag.forEach(b => h("div", "tritem" + (b.kind === "epic" ? " epic" : ""), bagTxt(b), bg));
    for (let k = 0; k < c.free; k++) h("div", "tritem trfree", "– free –", bg);

    const inc = h("div", "trbox trinc", null, R);
    h("div", "trh", "NEW: " + (c.incoming.kind === "gem" ? (c.incoming.mine ? "a gem is ready in the mine" : "a gem") : c.incoming.kind === "potion" ? "a potion" : c.incoming.it.epic ? "an epic item" : "an item"), inc);
    h("div", "tritem", c.incoming.kind === "gem" ? gemTxt(c.incoming.gem) : c.incoming.kind === "potion" ? potTxt(c.incoming.p) : itemTxt(c.incoming.it), inc);

    const q = h("div", "trbox", null, root);
    h("div", "trh", "What is the right move?", q);
    const acts = actionsFor(c);
    const tgtBox = h("div", "trtargets", null, q);
    const noteBox = h("input", "trnote", null, q); noteBox.placeholder = "Note (why / exception) – optional";
    const submit = h("button", "trsubmit", "Save answer and go to the next ▶", q); submit.disabled = true;
    const btns = [];
    acts.forEach(a => {
      const b = h("button", "tract", a.label, q); q.insertBefore(b, tgtBox); btns.push(b);
      b.onclick = () => {
        btns.forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true");
        picked = { action: a.id }; tgtBox.textContent = "";
        if (a.target) {
          submit.disabled = true;
          a.target().forEach(t => { const tb = h("button", "trtgt", t.label, tgtBox); tb.onclick = () => { picked.target = t.id; picked.targetLabel = t.label; [...tgtBox.children].forEach(x => x.setAttribute("aria-pressed", "false")); tb.setAttribute("aria-pressed", "true"); submit.disabled = false; }; });
          if (!a.target().length) h("div", "trmuted", "(nothing to pick)", tgtBox);
        } else submit.disabled = false;
      };
    });
    submit.onclick = () => {
      if (!picked) return;
      const rec = { n, ts: new Date().toISOString(), choice: picked, note: noteBox.value.trim(), scenario: c };
      answers[n] = picked.action; saveLocal();
      post({ cmd: "trainer", data: rec });
      history.push(n); n = nextUnanswered(n + 1); render();
    };
  }
  const nextUnanswered = from => { let k = from; while (answers[k]) k++; return k; };
  return { open() { n = nextUnanswered(1); history = []; render(); } };
})();
// ---- Fortress tab (user 2026-10-14): one tile per character with a fortress: building levels, the running build and the plan,
// resources (current/limit, uncollected production), soldiers, Hall of Knights, snapshot time.
const clock = iso => iso ? new Date(iso).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "?";
const leftText = iso => { const ms = new Date(iso) - Date.now(); if (!(ms > 0)) return "now";
  const m = Math.ceil(ms / 60000); return m >= 60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`; };
const ago = iso => { const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.floor(m/60)} h ago`; };
function fortTile(c){
  const f = c.fortress, t = document.createElement("div"); t.className = "ftile";
  t.style.setProperty("--c", classColor(c.now && c.now.class));
  const esc = s => String(s).replace(/[&<>]/g, x => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]));
  let h = `<div class="fh"><b>${esc(c.name)}</b><span>snapshot ${clock(f.updated)} (${ago(f.updated)})</span></div>`;
  h += `<h4>Buildings</h4><div class="fb">` + f.buildings.map(b => `<div>${esc(b.name.replace("Laborers' Quarters","Laborers").replace("Woodcutter's Hut","Woodcutter"))}<b>${b.level}</b></div>`).join("") + `<div>Hall of Knights<b>${f.hallOfKnights}</b></div></div>`;
  h += `<h4>Resources</h4><div class="fres">` + f.resources.map(r => {
    const pct = r.limit ? Math.min(100, r.current * 100 / r.limit) : 0;
    const full = r.prodLimit && r.ready * 100 / r.prodLimit >= 80;
    return `<span>${r.name}</span><span class="bar"><i style="width:${pct}%"></i></span><span>${r.current}/${r.limit} <small>+${r.ready}${full ? " ⚠" : ""}</small></span>`;
  }).join("") + `</div>`;
  const s = f.soldiers;
  h += `<h4>Soldiers</h4><div class="fline"><b>${s.count}</b>/${s.limit}` + (s.training ? ` · ${s.training} training${s.trainingFinish ? " (done in " + leftText(s.trainingFinish) + ")" : ""}` : "") + (s.level ? ` · level ${s.level}` : "") + `</div>`;
  if (f.gemSearch) h += `<div class="fline">Gem Mine: searching${f.gemSearch.finish ? " (done in " + leftText(f.gemSearch.finish) + ")" : ""}</div>`;
  if (f.builds){
    h += `<h4>Building</h4>`;
    if (f.running) h += `<div class="fline"><b>${esc(f.running.name)}</b> → ${f.running.to} · done in ${f.running.finish ? leftText(f.running.finish) : "?"} (${clock(f.running.finish)})</div>`;
    else h += `<div class="fline">nothing is being built</div>`;
    h += `<h4>Plan</h4>`;
    if (f.next) h += `<div class="fline">Next: <b>${esc(f.next.name)} → ${f.next.to}</b> (${f.next.minutes} min)</div>` + (f.next.waiting ? `<div class="fline wait">${esc(f.next.waiting)}</div>` : "");
    if (f.after && f.after.length) h += `<div class="fline wait">then ${f.after.map(a => esc(a.name) + " " + a.to).join(", ")}</div>`;
    if (!f.next) h += `<div class="fline wait">nothing planned</div>`;
  } else h += `<div class="fline wait" style="margin-top:8px">attack-only mode (no building)</div>`;
  t.innerHTML = h; return t;
}
function renderFort(){
  const box = $("ftiles"); box.replaceChildren();
  const shown = STATUS.filter(c => c.fortress && c.fortress.buildings);
  if (!shown.length){ const p = document.createElement("p"); p.className = "empty"; p.textContent = "No character has fortress data yet (needs level 25 and a running bot)."; box.appendChild(p); return; }
  shown.forEach(c => box.appendChild(fortTile(c)));
}
window.onStatus = (status, eodPending, attackMe) => { STATUS = status; renderTiles(); if (currentTab === "quests") renderQuests(); if (currentTab === "fort") renderFort(); renderEodStatus(eodPending || []); renderAttackMe(attackMe); };
setTab("chars");
</script>
