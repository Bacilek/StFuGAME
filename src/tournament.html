<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Challenge Tournament</title>
<style>
:root{--page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#e1e0d9;--good:#006300;--bad:#c62828;
--Warrior:#6d8197;--Scout:#8a5a2e;--Mage:#3f55d9;--Assassin:#e0680f;--BattleMage:#9145e0;--Berserker:#d42a30;
--Druid:#5aa832;--DemonHunter:#e0559f;--Bard:#2e9fe0;--Necromancer:#0a9e80;--Paladin:#c9a800;--PlagueDoctor:#2b7a3a;--Other:#898781}
@media (prefers-color-scheme:dark){:root{--page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--line:#2c2c2a;--good:#0ca30c;--bad:#ef9a9a;
--Warrior:#7f93a8;--Scout:#9a6234;--Mage:#4a5fe8;--Assassin:#f2781c;--BattleMage:#a45af2;--Berserker:#e3343a;
--Druid:#86d85a;--DemonHunter:#f46cb4;--Bard:#8fd3ff;--Necromancer:#0fbf98;--Paladin:#f6e358;--PlagueDoctor:#2b7a3a;--Other:#898781}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,sans-serif;padding:16px}
.wrap{max-width:1100px;margin:auto}
h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:0 0 10px} .sub{color:var(--ink2);margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button[aria-pressed=true]{border-color:var(--ink2);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;overflow-x:auto}
table{border-collapse:collapse;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
th{color:var(--ink2);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.pos{font-weight:700} .w{color:var(--good)} .l{color:var(--bad)} .self{color:var(--muted)}
.bar{display:inline-block;height:8px;border-radius:4px;background:var(--ink2);vertical-align:middle;margin-left:6px;opacity:.6}
.matrix td{text-align:center;min-width:46px}
.matrix th.rot{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;height:110px}
.muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<h1>Challenge Tournament</h1>
<div class="sub" id="sub"></div>
<div class="tabs" id="tabs" role="group" aria-label="Round"></div>
<div class="card"><h2>Standings</h2><div id="standings"></div></div>
<div class="card"><h2>Head to head <span class="muted">(row's win rate against the column, simulated fights)</span></h2><div id="matrix"></div></div>
</div>
<script>
const ROUNDS = /*DATA*/[]/*END*/;
const $ = id => document.getElementById(id);
const pretty = cls => (cls||"?").replace(/([a-z])([A-Z])/g, "$1 $2");
const color = c => { const cls = (c||"").replace(/\s/g,""); return `var(--${["Warrior","Scout","Mage","Assassin","BattleMage","Berserker","Druid","DemonHunter","Bard","Necromancer","Paladin","PlagueDoctor"].includes(cls)?cls:"Other"})`; };
let cur = ROUNDS.length - 1;
const cell = (row, text, cls) => { const c = row.insertCell(); c.textContent = text; if (cls) c.className = cls; return c; };
const name = (row, p) => { const c = row.insertCell(), d = document.createElement("span"); d.className="dot"; d.style.background=color(p.cls);
  c.append(d, document.createTextNode(p.nick)); return c; };

function render(){
  [...$("tabs").children].forEach((b,i)=>b.setAttribute("aria-pressed", i===cur));
  if (!ROUNDS.length){ $("sub").textContent = "No round yet – the first one runs at the end of day 1 (23:50)."; return; }
  const r = ROUNDS[cur], n = r.players.length;
  $("sub").textContent = `Day ${r.day} · ${r.date} · ${n} characters · ${r.iterations} simulated fights per pair` + (r.missing.length ? ` · not loaded: ${r.missing.join(", ")}` : "");
  // standings: opponents beaten (win rate > 50 %), then the average win rate
  const rows = r.players.map((p,i)=>{ const v = r.win[i].filter(x=>x!=null); return {p, i,
    beaten: v.filter(x=>x>0.5).length, avg: v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0}; })
    .sort((a,b)=> b.beaten-a.beaten || b.avg-a.avg);
  const t = document.createElement("table"), h = t.insertRow();
  ["#","Character","Class","Beaten","Lost","Avg win rate"].forEach(x=>{ const th=document.createElement("th"); th.textContent=x; h.appendChild(th); });
  rows.forEach((o,k)=>{ const row=t.insertRow(); cell(row, k+1, "pos"); name(row, o.p); cell(row, pretty(o.p.cls));
    cell(row, o.beaten, "w"); cell(row, (n-1)-o.beaten, "l");
    const c = cell(row, (o.avg*100).toFixed(1)+" %"); const bar=document.createElement("span"); bar.className="bar"; bar.style.width=Math.round(o.avg*80)+"px"; c.appendChild(bar); });
  $("standings").replaceChildren(t);
  // matrix in the standings order
  const m = document.createElement("table"); m.className="matrix"; const hr = m.insertRow();
  hr.appendChild(document.createElement("th"));
  rows.forEach(o=>{ const th=document.createElement("th"); th.className="rot"; th.textContent=o.p.nick; hr.appendChild(th); });
  rows.forEach(a=>{ const row=m.insertRow(); name(row, a.p);
    rows.forEach(b=>{ if (a.i===b.i){ cell(row,"–","self"); return; } const v=r.win[a.i][b.i];
      cell(row, v==null?"?":Math.round(v*100)+" %", v==null?"":(v>0.5?"w":"l")); }); });
  $("matrix").replaceChildren(m);
}
ROUNDS.forEach((r,i)=>{ const b=document.createElement("button"); b.textContent=`Day ${r.day}`; b.addEventListener("click",()=>{cur=i;render();}); $("tabs").appendChild(b); });
render();
</script>
</body>
</html>
